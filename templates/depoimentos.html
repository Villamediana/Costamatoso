<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Depoimentos - Costamatoso</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/logo.png') }}">
    <!-- Etiqueta meta para dispositivos móveis -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Vincular ao CSS usando Flask -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script type="text/javascript" async src="https://d335luupugsy2.cloudfront.net/js/loader-scripts/e14c28a9-8a58-40cc-911a-e42b3f76a7c5-loader.js" ></script>
    <style>
        /* Barra de progresso */
        .progress-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 0;
            height: 3px;
            background-color: #a9a9a9; /* Cor da barra igual à barra de rolagem */
            z-index: 1000;
            border-radius: 5px;
            transition: width 0.25s ease-out;
        }

        /* Espaço adicional antes do footer */
        .seccion-sobre-nos {
            margin-bottom: 50px; /* Adicionado espaço antes do footer */
        }
        .capa-imagem-sobre-nos {
            position: relative;
            width: 100%;
            height: 50vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #f5f5f5;
        }
        .depo-image-contain {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <!-- Barra de progresso -->
    <div class="progress-bar" id="progress-bar"></div>

    <!-- Sobreposição para o fundo -->
    <div class="overlay"></div>

    <!-- Menú de navegação -->
    <header class="header-white">
        <nav class="navbar">
            <div class="logo ocultar-logo">
                <a href="{{ url_for('index') }}">
                    <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Logo">
                </a>
            </div>
            <div class="menu-icon">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </nav>
        <!-- Menú desplegable -->
        {% include 'fixed/menu.html' %}
    </header>

    <!-- Seção de imagem de cabeçalho -->
    <section class="seccion imagem-cabecalho">
        <div class="cabecalho">
            <img src="{{ url_for('static', filename='img/capa-depoimentos.jpg') }}" alt="Depoimentos">
            <div class="overlay-cabecalho"></div>
            <div class="texto-cabecalho">
                <h1>Depoimentos</h1>
            </div>
        </div>
    </section>

    <!--SECCAO DE DEPOIMENTOS-->
    <section class="seccion conteudo">
        <div class="container">
            {% for depo in testimonials %}
                <div class="depo-block depo-anim">
                    <div class="depo-block-image">
                        <img src="{{ url_for('static', filename=depo.image) }}" alt="{{ depo.title }}" class="depo-image-contain">
                    </div>
                    <div class="depo-block-content">
                        <h2 class="depo-block-title">{{ depo.title }}</h2>
                        <p class="depo-block-text">{{ depo.text }}</p>
                    </div>
                </div>
            {% endfor %}
        </div>
    </section>
    <!--FIM SECCAO DE DEPOIMENTOS-->

    {% include 'fixed/footer.html' %}

    <!-- Vincular ao arquivo JavaScript usando Flask -->
    <script>
        // Atualizar a barra de progresso com base no scroll
        const progressBar = document.getElementById('progress-bar');
        window.addEventListener('scroll', () => {
            const scrollTop = window.scrollY;
            const docHeight = document.body.scrollHeight - window.innerHeight;
            const scrollPercent = (scrollTop / docHeight) * 100;
            progressBar.style.width = scrollPercent + '%';
        });
    </script>

        <!-- Vincular ao arquivo JavaScript usando Flask -->
        <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
